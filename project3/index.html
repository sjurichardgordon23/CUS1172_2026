<!DOCTYPE html>
<html lang="en">
<head>
    <title>Burger Order Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.js"></script>
    
    <style>
        body {
            background-color: rgba(229, 211, 179);
            font-family: 'Times New Roman', Times, serif;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: rgba(102, 66, 41);
            margin-bottom: 30px;
        }

        .order-summary {
            background-color: rgba(229, 211, 179);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid rgba(102, 66, 41);
        }

        .order-summary h3 {
            color: rgba(102, 66, 41);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .order-summary p {
            color: rgba(102, 66, 41);
            margin: 5px 0;
        }

        .step-container {
            margin: 30px 0;
        }

        .step-title {
            color: rgba(102, 66, 41);
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .option-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: rgba(229, 211, 179);
            border: 2px solid rgba(102, 66, 41);
            color: rgba(102, 66, 41);
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background-color: rgba(102, 66, 41);
            color: white;
        }

        .option-btn.active {
            background-color: rgba(102, 66, 41);
            color: white;
        }

        .form-control {
            background-color: rgba(229, 211, 179);
            border: 2px solid rgba(102, 66, 41);
            color: rgba(102, 66, 41);
            padding: 10px;
        }

        .form-control:focus {
            border-color: rgba(102, 66, 41);
            box-shadow: none;
            background-color: rgba(229, 211, 179);
            color: rgba(102, 66, 41);
        }

        .btn-primary {
            background-color: rgba(102, 66, 41);
            border: none;
            padding: 10px 25px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: rgba(120, 101, 84);
        }

        .confirmation-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            animation: fadeOut 1s ease-in-out;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }

        .feedback-box {
            background-color: #fff3cd;
            border: 2px solid #ff9800;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .feedback-message {
            color: rgba(102, 66, 41);
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-got-it {
            background-color: #ff9800;
            border: none;
            color: white;
            padding: 10px 25px;
            font-weight: bold;
        }

        .btn-got-it:hover {
            background-color: #e68900;
        }

        .final-message {
            text-align: center;
            color: rgba(102, 66, 41);
            font-size: 1.5rem;
            font-weight: bold;
            margin: 30px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        label {
            color: rgba(102, 66, 41);
            font-weight: bold;
            margin-top: 15px;
        }

        .image-option {
            display: inline-block;
            margin: 10px;
            text-align: center;
            cursor: pointer;
        }

        .image-btn {
            background-color: rgba(229, 211, 179);
            border: 2px solid rgba(102, 66, 41);
            color: rgba(102, 66, 41);
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        .image-btn:hover {
            background-color: rgba(102, 66, 41);
            color: white;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>King Burger Order Kiosk</h1>
    
    <div id="app"></div>
</div>

<script id="welcome-template" type="text/x-handlebars-template">
    <div class="step-container">
        <h2 class="step-title">Welcome! What's your name?</h2>
        <input type="text" id="nameInput" class="form-control" placeholder="Enter your name">
        <button class="btn btn-primary mt-3" onclick="controller.submitName()">Continue</button>
    </div>
</script>

<script id="burger-selection-template" type="text/x-handlebars-template">
    <div class="order-summary">
        <h3>Order Summary</h3>
        <p><strong>Name:</strong> {{userName}}</p>
        {{#each selections}}
        <p><strong>{{this.step}}:</strong> {{this.value}}</p>
        {{/each}}
    </div>

    <div class="step-container">
        <h2 class="step-title">Choose Your Burger</h2>
        <div class="option-buttons">
            {{#each burgers}}
            <button class="option-btn" onclick="controller.selectBurger('{{this.id}}', '{{this.title}}')">{{this.title}}</button>
            {{/each}}
        </div>
    </div>
</script>

<script id="customization-template" type="text/x-handlebars-template">
    <div class="order-summary">
        <h3>Order Summary</h3>
        <p><strong>Name:</strong> {{userName}}</p>
        <p><strong>Burger:</strong> {{burgerTitle}}</p>
        {{#each selectedItems}}
        <p><strong>{{this.step}}:</strong> {{this.value}}</p>
        {{/each}}
    </div>

    {{#if confirmationMessage}}
    <div class="confirmation-message">{{confirmationMessage}}</div>
    {{/if}}

    <div class="step-container">
        <h2 class="step-title">{{currentStep.instruction}}</h2>
        
        {{#if showFeedback}}
        <div class="feedback-box">
            <div class="feedback-message">{{feedbackMessage}}</div>
            <button class="btn btn-got-it" onclick="controller.dismissFeedback()">Got it</button>
        </div>
        {{else}}
            {{#if isMultipleChoice}}
            <div class="option-buttons">
                {{#each currentStep.options}}
                <button class="option-btn" onclick="controller.makeSelection('{{this}}')">{{this}}</button>
                {{/each}}
            </div>
            {{/if}}

            {{#if isText}}
            <input type="number" id="textInput" class="form-control" placeholder="Enter number (1-5)" min="1" max="5">
            <button class="btn btn-primary mt-3" onclick="controller.submitText()">Continue</button>
            {{/if}}

            {{#if isImageSelection}}
            <div class="option-buttons">
                {{#each currentStep.imageOptions}}
                <button class="option-btn image-btn" onclick="controller.selectImage('{{this.value}}', '{{this.label}}')">{{this.label}}</button>
                {{/each}}
            </div>
            {{/if}}
        {{/if}}
    </div>
</script>

<script id="final-template" type="text/x-handlebars-template">
    <div class="order-summary">
        <h3>Final Order Summary</h3>
        <p><strong>Name:</strong> {{userName}}</p>
        <p><strong>Burger:</strong> {{burgerTitle}}</p>
        {{#each selectedItems}}
        <p><strong>{{this.step}}:</strong> {{this.value}}</p>
        {{/each}}
    </div>

    <div class="final-message">
        {{#if completedAllSteps}}
        Thank you, {{userName}}! Your burger is on the grill!
        {{else}}
        Oops, {{userName}}! You skipped a few steps. Want to try again?
        {{/if}}
    </div>

    <div class="button-group">
        <button class="btn btn-primary" onclick="controller.restartOrder()">Start New Order</button>
        <button class="btn btn-primary" onclick="controller.returnHome()">Return Home</button>
    </div>
</script>

<script src="app.js"></script>

</body>
</html>
