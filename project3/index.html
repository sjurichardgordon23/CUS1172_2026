<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Builder Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.7/dist/handlebars.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #d4145a;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .order-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .order-summary h3 {
            color: white;
            margin-bottom: 15px;
        }
        .order-summary p {
            margin: 5px 0;
            font-size: 0.9rem;
        }
        .step-container {
            margin: 30px 0;
        }
        .step-title {
            color: #d4145a;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .option-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .option-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .option-btn:hover {
            transform: translateY(-2px);
        }
        .form-control {
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
        }
        .confirmation-message {
            background: #4caf50;
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            animation: fadeInOut 1s ease-in-out;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .feedback-box {
            background: #ff9800;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }
        .image-option {
            display: inline-block;
            margin: 10px;
            text-align: center;
            cursor: pointer;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .image-option:hover {
            border-color: #d4145a;
            transform: scale(1.05);
        }
        .image-option img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
        .final-message {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin: 20px 0;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🍔 Burger Builder Kiosk 🍔</h1>
    <div id="app"></div>
</div>

<!-- Handlebars Templates -->
<script id="welcome-template" type="text/x-handlebars-template">
    <div class="step-container">
        <h2 class="step-title">Welcome to Burger Builder!</h2>
        <p style="color: #666; margin-bottom: 20px;">What's your name?</p>
        <input type="text" id="userName" class="form-control" placeholder="Enter your name">
        <button class="btn btn-primary mt-3" onclick="controller.submitName()">Start Building →</button>
    </div>
</script>

<script id="burger-selection-template" type="text/x-handlebars-template">
    <div class="order-summary" id="orderSummary">
        <h3>📋 Your Order</h3>
        <p><strong>Customer:</strong> {{userName}}</p>
        {{#each selections}}
        <p><strong>{{step}}:</strong> {{value}}</p>
        {{/each}}
    </div>
    <div class="step-container">
        <h2 class="step-title">Choose Your Burger Base</h2>
        <div class="option-buttons">
            {{#each burgers}}
            <button class="option-btn" onclick="controller.selectBurger('{{id}}', '{{title}}')">
                🍔 {{title}}
            </button>
            {{/each}}
        </div>
    </div>
</script>

<script id="step-template" type="text/x-handlebars-template">
    <div class="order-summary" id="orderSummary">
        <h3>📋 Your Order</h3>
        <p><strong>Customer:</strong> {{userName}}</p>
        <p><strong>Burger:</strong> {{burgerTitle}}</p>
        {{#each selections}}
        <p><strong>{{step}}:</strong> {{value}}</p>
        {{/each}}
    </div>

    {{#if confirmationMessage}}
    <div class="confirmation-message">{{confirmationMessage}}</div>
    {{/if}}

    {{#if showFeedback}}
    <div class="feedback-box">
        <p style="font-size: 1.2rem; margin-bottom: 15px;">⚠️ {{feedbackMessage}}</p>
        <button class="btn btn-light" onclick="controller.dismissFeedback()">Got it!</button>
    </div>
    {{else}}
    <div class="step-container">
        <h2 class="step-title">{{instruction}}</h2>
        
        {{#if isMultipleChoice}}
        <div class="option-buttons">
            {{#each options}}
            <button class="option-btn" onclick="controller.makeSelection('{{this}}')">{{this}}</button>
            {{/each}}
        </div>
        {{/if}}

        {{#if isTextInput}}
        <input type="number" id="textValue" class="form-control" min="1" max="5" placeholder="Enter number (1-5)">
        <button class="btn btn-primary mt-3" onclick="controller.submitText()">Continue →</button>
        {{/if}}

        {{#if isImageSelection}}
        <div style="text-align: center;">
            {{#each imageOptions}}
            <div class="image-option" onclick="controller.selectImage('{{value}}', '{{label}}')">
                <div style="width: 150px; height: 150px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">
                    🍔 {{label}}
                </div>
                <p style="margin-top: 10px; font-weight: bold;">{{label}}</p>
            </div>
            {{/each}}
        </div>
        {{/if}}
    </div>
    {{/if}}
</script>

<script id="final-template" type="text/x-handlebars-template">
    <div class="order-summary">
        <h3>📋 Final Order Summary</h3>
        <p><strong>Customer:</strong> {{userName}}</p>
        <p><strong>Burger:</strong> {{burgerTitle}}</p>
        {{#each selections}}
        <p><strong>{{step}}:</strong> {{value}}</p>
        {{/each}}
    </div>

    <div class="final-message">
        {{#if completedAllSteps}}
        🎉 Thank you, {{userName}}! Your burger is on the grill! 🎉
        {{else}}
        😅 Oops, {{userName}}! You skipped a few steps. Want to try again?
        {{/if}}
    </div>

    <div class="button-group">
        <button class="btn btn-primary" onclick="controller.restart()">Start New Order</button>
        <button class="btn btn-secondary" onclick="controller.returnHome()">Return Home</button>
    </div>
</script>

<script src="app.js"></script>
</body>
</html>
