<html>
<head>
    <title>To Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color: rgba(229,211,179);
            font-family:'Times New Roman', Times, serif;
            padding: 20px;
        }

        h1{
            text-align:center;
            color: rgba(102,66,41);
        }

        label{
            color: rgba(102,66,41);
            font-weight: bold;
        }

        p{
            color: rgba(120,101,84);
        }

        /* Inputs */

        .form-control,
        .form-select{
            background-color: rgba(229,211,179);
            border: 1px solid rgba(102,66,41);
            color: rgba(102,66,41);
        }

        .form-control:focus,
        .form-select:focus{
            border-color: rgba(102,66,41);
            box-shadow: none;
        }

        

        .btn-primary{
            background-color: rgba(102,66,41);
            border: none;
        }

        .btn-primary:hover{
            background-color: rgba(120,101,84);
        }

        

        .task-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(102,66,41);
            color: rgba(102,66,41);
            font-weight: bold;
        }

        ul{
            margin-top: 20px;
        }

    </style>
</head>

<body>

<h1>Task List</h1>

<form id="taskForm">

    <div class="mb-3">
        <label for="taskName" class="form-label">Task Name</label>
        <input type="text" class="form-control" id="taskName" required>
    </div>

    <div class="mb-3">
        <label for="taskPriority" class="form-label">Priority</label>

        <select class="form-select" id="taskPriority" required>
            <option value="">Select Priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Add Task</button>

</form>

<ul id="task_list" class="list-unstyled">
</ul>

<script src="script.js"></script>

</body>
</html>
